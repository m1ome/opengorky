# Builds the macOS, Linux and Windows packages (scripts/dist-*.sh). A v* tag publishes them as a
# GitHub release; asset names don't change between versions, so the site can link
# https://github.com/<owner>/<repo>/releases/latest/download/<asset>.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ZIG: 0.17.0

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe → CFBundleVersion
      - name: Zig
        run: |
          curl -sSL https://ziglang.org/download/$ZIG/zig-aarch64-macos-$ZIG.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-$ZIG" >> "$GITHUB_PATH"
      - run: scripts/dist-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: zig-out/dist/*.zip

  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dist-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: zig-out/dist/*.tar.xz

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dist-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: zig-out/dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
